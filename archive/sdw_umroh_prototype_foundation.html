    // Component: Status Badge
    function renderStatusBadge(status, type = 'DEFAULT') {
      const s = String(status || '').toUpperCase();
      let colorClass = 'bg-slate-100 text-slate-700 border-slate-200';
      let label = status;

      switch (s) {
        case 'CONFIRMED':
        case 'VERIFIED':
        case 'COMPLETED':
        case 'PAID':
        case 'PUBLISHED':
          colorClass = 'bg-emerald-50 text-sdw-emerald border-emerald-200';
          label = s === 'PAID' ? 'LUNAS' : (s === 'CONFIRMED' ? 'TERKONFIRMASI' : (s === 'VERIFIED' ? 'TERVERIFIKASI' : label));
          break;
        case 'REVISION_REQUIRED':
        case 'NEEDS_REVISION':
        case 'OVERDUE':
        case 'CRITICAL':
          colorClass = 'bg-red-50 text-red-700 border-red-200 font-bold';
          label = s === 'REVISION_REQUIRED' ? 'PERLU PERBAIKAN' : label;
          break;
        case 'UNDER_REVIEW':
        case 'IN_PROGRESS':
        case 'PARTIAL':
        case 'CONSULTATION':
        case 'PROPOSAL':
          colorClass = 'bg-amber-50 text-amber-800 border-amber-200';
          label = s === 'UNDER_REVIEW' ? 'DALAM PENGECEKAN' : (s === 'PARTIAL' ? 'SEBAGIAN (DP)' : label);
          break;
        case 'OPEN':
        case 'QUALIFIED':
        case 'NEW':
        case 'SCHEDULED':
          colorClass = 'bg-blue-50 text-blue-800 border-blue-200';
          label = s === 'OPEN' ? 'TERSEDIA' : label;
          break;
        case 'FULL':
        case 'CLOSED':
          colorClass = 'bg-slate-200 text-slate-800 border-slate-300';
          label = 'PENUH';
          break;
        case 'NOT_UPLOADED':
        case 'NOT_STARTED':
        case 'DRAFT':
          colorClass = 'bg-slate-100 text-slate-500 border-slate-200';
          label = s === 'NOT_UPLOADED' ? 'BELUM UPLOAD' : (s === 'NOT_STARTED' ? 'BELUM MULAI' : 'DRAFT');
          break;
      }

      return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold border ${colorClass}">${escapeHtml(label)}</span>`;
    }

    // Helper: Dynamic Financial Calculation (paid = SUM(payments), outstanding = total - paid)
    function calculateInvoiceFinance(inv) {
      const verifiedPaid = (inv.payments || [])
        .filter(p => p.status === 'VERIFIED')
        .reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
      const total = Number(inv.total_amount) || 0;
      const outstanding = Math.max(0, total - verifiedPaid);
      return {
        ...inv,
        calculated_paid: verifiedPaid,
        calculated_outstanding: outstanding
      };
    }

    // Component: Next Action Engine (Section 29 — Data-driven Priority Ordering)
    function getNextAction() {
      // Priority 1: Blocking Condition on Documents (REVISION_REQUIRED)
      const docRevision = MOCK_DATA.pilgrimDocuments.find(d => d.status === 'REVISION_REQUIRED');
      if (docRevision) {
        return {
          type: 'BLOCKING_REVISION',
          severity: 'HIGH',
          title: 'Perbaikan Berkas Dibutuhkan',
          message: `Dokumen <b>${escapeHtml(docRevision.title)}</b> ditandai perlu perbaikan oleh petugas verifikator (Simulasi).`,
          actionLabel: 'Upload Revisi Sekarang',
          targetTab: 'DOCUMENTS',
          actionPayload: docRevision.id
        };
      }

      // Priority 2: Payment Outstanding (Calculated dynamically: total - paid)
      const fin = calculateInvoiceFinance(MOCK_DATA.invoice);
      if (fin.calculated_outstanding > 0) {
        return {
          type: 'PAYMENT_PENDING',
          severity: 'MEDIUM',
          title: 'Pelunasan Biaya Umroh (Sisa Tagihan)',
          message: `Sisa tagihan Rp ${fin.calculated_outstanding.toLocaleString('id-ID')} jatuh tempo pada ${fin.due_date}. Terverifikasi: Rp ${fin.calculated_paid.toLocaleString('id-ID')}.`,
          actionLabel: 'Lihat Rincian & Konfirmasi Bayar',
          targetTab: 'PAYMENT',
          actionPayload: null
        };
      }

      // Priority 3: Existing Preparation / Manasik Action
      const activePrep = MOCK_DATA.preparationItems.find(p => p.status === 'IN_PROGRESS');
      if (activePrep) {
        return {
          type: 'PREPARATION_PROGRESS',
          severity: 'INFO',
          title: 'Persiapan Keberangkatan',
          message: `Tahap persiapan aktif: <b>${escapeHtml(activePrep.item_name)}</b> (${escapeHtml(activePrep.notes)}).`,
          actionLabel: 'Lihat Agenda Persiapan',
          targetTab: 'PREPARATION',
          actionPayload: activePrep.id
        };
      }

      return {
        type: 'READY',
        severity: 'INFO',
        title: 'Seluruh Persiapan Berjalan Lancar',
        message: 'Tidak ada tindakan darurat yang memblokir perjalanan Anda. Hadiri sesi manasik berikutnya.',
        actionLabel: 'Lihat Jadwal Manasik',
        targetTab: 'MANASIK',
        actionPayload: null
      };
    }

    // Client-side table filter engine (Section 18 & PRD Search requirement)
    function filterDataTable(inputEl) {
      const query = (inputEl.value || '').toLowerCase().trim();
      const wrapper = inputEl.closest('[data-table-wrapper]');
      if (!wrapper) return;

      const rows = wrapper.querySelectorAll('tbody tr[data-row]');
      const countBadge = wrapper.querySelector('[data-count-display]');
      let visibleCount = 0;

      rows.forEach(row => {
        const text = (row.textContent || '').toLowerCase();
        if (!query || text.includes(query)) {
          row.style.display = '';
          visibleCount++;
        } else {
          row.style.display = 'none';
        }
      });

      // Handle empty state row if no search matches
      let emptyRow = wrapper.querySelector('[data-empty-search-row]');
      if (visibleCount === 0 && rows.length > 0) {
        if (!emptyRow) {
          emptyRow = document.createElement('tr');
          emptyRow.setAttribute('data-empty-search-row', 'true');
          const colCount = wrapper.querySelectorAll('thead th').length || 5;
          emptyRow.innerHTML = `<td colspan="${colCount}" class="p-8 text-center text-slate-400 italic">Tidak ada data yang cocok dengan "${escapeHtml(inputEl.value)}".</td>`;
          wrapper.querySelector('tbody').appendChild(emptyRow);
        } else {
          emptyRow.style.display = '';
          emptyRow.querySelector('td').innerHTML = `Tidak ada data yang cocok dengan "${escapeHtml(inputEl.value)}".`;
        }
      } else if (emptyRow) {
        emptyRow.style.display = 'none';
      }

      if (countBadge) {
        countBadge.textContent = query 
          ? `Menampilkan ${visibleCount} dari ${rows.length} entri`
          : `Menampilkan ${rows.length} entri`;
      }
    }

      }

      renderCurrentSurface();
    });

    // Audit 21 — C6: hormati preferensi reduced-motion pada smooth scroll
    function prefersReducedMotion() {
      return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    // Switch between 5 Surfaces
    function switchSurface(surface) {
      appState.surface = surface;
      updateNavigationHighlight(surface);
      renderCurrentSurface();
      window.scrollTo({ top: 0, behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
    }

    function renderCurrentSurface() {
      const container = document.getElementById('mainViewport');
      if (appState.surface === 'PUBLIC') {
        container.innerHTML = renderPublicSurface();
      } else if (appState.surface === 'PILGRIM') {
        container.innerHTML = renderPilgrimSurface();
      } else if (appState.surface === 'PARTNER') {
        container.innerHTML = renderPartnerSurface();
      } else if (appState.surface === 'BACKOFFICE') {
        container.innerHTML = renderBackofficeSurface();
      } else if (appState.surface === 'FOUNDATION') {
        container.innerHTML = renderFoundationSurface();
        renderSheetGrid();
      }
    }

      const surfaces = ['PUBLIC', 'PILGRIM', 'PARTNER', 'BACKOFFICE', 'FOUNDATION'];
      surfaces.forEach(s => {
        const deskBtn = document.getElementById(`nav-${s}`);
        const mobBtn = document.getElementById(`mobnav-${s}`);
        const isActive = (s === surface);

        if (deskBtn) {
          deskBtn.className = isActive 
            ? 'px-3 py-1.5 rounded-lg transition-all text-white bg-sdw-emerald shadow-sm flex items-center space-x-1.5 font-bold'
            : 'px-3 py-1.5 rounded-lg transition-all text-slate-300 hover:text-white flex items-center space-x-1.5';

        if (mobBtn) {
          mobBtn.className = isActive 
            ? 'py-1.5 px-3 rounded-lg font-bold text-white bg-sdw-emerald whitespace-nowrap min-h-[36px] flex items-center shadow-sm'
            : 'py-1.5 px-3 rounded-lg text-emerald-200 hover:text-white whitespace-nowrap min-h-[36px] flex items-center';
        }
      });
    }

    function setAppRole(newRole) {
      appState.role = newRole;
      const roleSelect = document.getElementById('roleSelector');
      if (roleSelect) {
        roleSelect.value = newRole;
      }
    }

    function handleRoleChange(newRole) {
      setAppRole(newRole);
      showToast(`Simulasi role beralih ke: ${newRole}`);
      
      // Auto route to surface and sub-tab matching persona
      if (newRole === 'VISITOR') {
        switchSurface('PUBLIC');
      } else if (newRole === 'PILGRIM') {

    function showToast(message) {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      while (container.children.length >= 2) {
        container.removeChild(container.firstChild);
      }
      const toast = document.createElement('div');
      toast.className = 'bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-2xl border border-slate-700 flex items-center space-x-2.5 mb-2 pointer-events-auto fade-in';
      toast.innerHTML = `<span class="text-sdw-gold font-bold">&#9432;</span><span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function confirmBookingRegistration(pkgId, depId, roomType, paxCount) {
      const pkg = MOCK_DATA.packages.find(p => p.id === pkgId) || MOCK_DATA.packages[0];

      const surcharge = roomSurcharges[roomType] || 0;
      const pricePerPax = basePrice + surcharge;
      const totalCost = pricePerPax * Number(paxCount);
      const dpPerPax = 5000000;
      const totalDp = dpPerPax * Number(paxCount);
      const sisaPelunasan = Math.max(0, totalCost - totalDp);

      const newRegId = `REG-${regNum}`;
      const newInvNumber = `INV/2027/SDW-${Math.floor(1000 + Math.random() * 9000)}`;

        room_type: `${roomType} (${paxCount} Orang)`,
        current_stage: 'Persiapan',
        registration_status: 'CONFIRMED',
        agreed_price_snapshot: totalCost,
        discount_snapshot: 0,
        final_price_snapshot: totalCost

      // 2. Update Invoice State & Schedules
      MOCK_DATA.invoice = {

        total_amount: totalCost,

      dep.capacity_booked = Math.min(dep.capacity_total, dep.capacity_booked + Number(paxCount));

      // 4. Register into Backoffice Table
      MOCK_DATA.registrations.unshift({
        id: newRegId,
        customer: fullName,
        package: pkg.name,
        departure: dep.departure_date,
        status: 'CONFIRMED',
        docs: '1/5 Berkas',
        payment: `DP Rp ${totalDp.toLocaleString('id-ID')} Terverifikasi`

      // 5. Reset document requirements with 1 revision needed for interactive exploration

          id: 'DOC-000001',
          code: 'PASSPORT',
          title: 'Paspor RI (Masa Berlaku Min. 7 Bulan)',
          is_mandatory: true,

          file_name: 'paspor_scan_demo.jpg',
          review_notes: 'Foto paspor terpotong pada bagian MRZ barcode bawah. Harap upload ulang scan halaman data diri secara utuh.',
          updated_at: 'Baru saja'
        },
        {
          id: 'DOC-000002',
          code: 'KTP',
          title: 'Kartu Tanda Penduduk (e-KTP)',
          is_mandatory: true,
          status: 'VERIFIED',
          file_name: 'ktp_demo_valid.pdf',
          review_notes: 'KTP telah divalidasi sesuai data kependudukan.',

          code: 'PHOTO',
          title: 'Pas Foto Latar Putih (4x6)',
          is_mandatory: true,
          status: 'UNDER_REVIEW',
          file_name: 'pasfoto_demo_white_bg.jpg',
          review_notes: 'Sedang dalam antrean verifikasi staf dokumen (Simulasi).',
          updated_at: 'Baru saja'
        },
        {
          id: 'DOC-000004',
          code: 'BUKU_NIKAH',
          title: 'Buku Nikah / Akta Lahir (Bila Suami-Istri)',
          is_mandatory: true,
          status: 'VERIFIED',
          file_name: 'buku_nikah_scan.pdf',
          review_notes: 'Tervalidasi (Simulasi).',
          updated_at: 'Baru saja'
        },
        {
          id: 'DOC-000005',
          code: 'VAKSIN_MENINGITIS',
          title: 'Sertifikat Vaksin Meningitis (ICV)',
          is_mandatory: false,
          status: 'NOT_UPLOADED',
          file_name: null,
          review_notes: 'Wajib diserahkan maksimal H-20 keberangkatan.',
          updated_at: '-'

      ];

    /* ========================================================================
       11. FOUNDATION DIAGNOSTIC RUNNERS (Preserved from Step 1)
       ======================================================================== */
    function logToTerminal(message, type = 'LOG', payload = null) {
      const body = document.getElementById('terminalBody');
      if (!body) return;
      const time = new Date().toLocaleTimeString('id-ID');
      const entry = document.createElement('div');
      entry.className = 'leading-relaxed break-words';

      let typeColor = 'text-slate-400';
      if (type === 'SUCCESS') typeColor = 'text-emerald-400 font-semibold';
      if (type === 'ERROR') typeColor = 'text-red-400 font-semibold';
      if (type === 'INFO') typeColor = 'text-blue-400';

      let html = `<span class="text-slate-600">[${time}]</span> <span class="${typeColor}">${type}:</span> <span>${escapeHtml(message)}</span>`;
      if (payload) {
        html += `<pre class="mt-1 p-2 bg-slate-950/80 rounded border border-slate-800 text-[10px] text-emerald-300 overflow-x-auto">${escapeHtml(JSON.stringify(payload, null, 2))}</pre>`;
      }

      entry.innerHTML = html;
      body.appendChild(entry);
      body.scrollTop = body.scrollHeight;
    }

    function clearConsole() {
      const body = document.getElementById('terminalBody');
      if (body) body.innerHTML = '<div class="text-slate-500">// Konsol dibersihkan.</div>';

    function runHealthCheck() {
      const t0 = performance.now();
      logToTerminal('Mengirim permintaan testConnection() ke Code.gs backend...', 'INFO');

      if (appState.bridgeMode === 'GAS' && typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((res) => {
            const dt = Math.round(performance.now() - t0);
            updateLatency(dt);
            if (res.success) {
              logToTerminal('Health Check Berhasil. Spreadsheet aktif terhubung.', 'SUCCESS', res.data);
            } else {
              logToTerminal(`Health Check Gagal: ${res.error}`, 'ERROR');
            }
          })
          .withFailureHandler((err) => {
            const dt = Math.round(performance.now() - t0);
            updateLatency(dt);
            logToTerminal(`Koneksi Gagal: ${err.message}`, 'ERROR');
          })
          .testConnection();
      } else {
        setTimeout(() => {
          const dt = Math.round(performance.now() - t0);
          updateLatency(dt);
          const mockData = {
            status: 'SIMULATED_HEALTHY',
            mode: 'LOCAL_PROTOTYPE_SANDBOX',
            note: 'Status disimulasikan lokal sesuai spesifikasi 00-19',
            totalSheetsDefined: 22,
            latencyMs: dt
          };
          logToTerminal('Health Check Sandbox Selesai (Simulasi Lokal).', 'SUCCESS', mockData);
        }, 280);
      }
    }

    function runInitDatabase() {
      const t0 = performance.now();
      logToTerminal('Memeriksa kelengkapan 22 Sheet Master di Google Spreadsheet...', 'INFO');

      if (appState.bridgeMode === 'GAS' && typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((res) => {
            const dt = Math.round(performance.now() - t0);
            updateLatency(dt);
            if (res.success) {
              logToTerminal(`Inisialisasi 22 Sheet Tuntas. Baru dibuat: ${res.data.created.length}`, 'SUCCESS', res.data);
            } else {
              logToTerminal(`Inisialisasi Gagal: ${res.error}`, 'ERROR');
            }
          })
          .withFailureHandler((err) => {
            logToTerminal(`Error Backend: ${err.message}`, 'ERROR');
          })
          .initDatabase();
      } else {
        setTimeout(() => {
          const dt = Math.round(performance.now() - t0);
          updateLatency(dt);
          logToTerminal('22 Sheet Master terverifikasi lengkap (Simulasi Sandbox).', 'SUCCESS', {
            sheetsConfigured: Object.keys(SHEETS_SCHEMA).length,
            structureCompliant: true
          });
        }, 350);
      }
    }

    function runReadWriteTest() {
      const t0 = performance.now();
      const testActor = `${appState.role}_CLIENT`;
      logToTerminal(`Menguji operasi Tulis -> Baca record audit oleh actor: ${testActor}...`, 'INFO');

      if (appState.bridgeMode === 'GAS' && typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((res) => {
            const dt = Math.round(performance.now() - t0);
            updateLatency(dt);
            if (res.success) {
              logToTerminal(`Roundtrip Read/Write Sukses! Checksum: ${res.data.testId}`, 'SUCCESS', res.data);
            } else {
              logToTerminal(`Uji Mutasi Gagal: ${res.error}`, 'ERROR');
            }
          })
          .withFailureHandler((err) => {
            logToTerminal(`Error Mutasi: ${err.message}`, 'ERROR');
          })
          .performReadWriteTest(testActor);
      } else {
        setTimeout(() => {
          const dt = Math.round(performance.now() - t0);
          updateLatency(dt);
          const generatedId = 'AUD-SIM-' + Math.floor(100000 + Math.random() * 900000);
          logToTerminal(`Verifikasi Mutasi Read/Write Lulus (Simulasi Lokal). Checksum ID: ${generatedId}`, 'SUCCESS', {
            testId: generatedId,
            actor: testActor,
            action: 'CONNECTION_READ_WRITE_VERIFICATION',
            verificationStatus: 'PASSED (Local Emulation Checksum Matched)'
          });
        }, 420);
      }
    }

    function updateLatency(ms) {
      const el = document.getElementById('terminalLatency');
      if (el) el.textContent = `Latency: ${ms}ms`;
    }

    function renderSheetGrid(filter = '') {
      const grid = document.getElementById('sheetGrid');
      if (!grid) return;
      grid.innerHTML = '';
      const filterLower = filter.toLowerCase();

      for (const [name, meta] of Object.entries(SHEETS_SCHEMA)) {
        if (filterLower && !name.toLowerCase().includes(filterLower) && !meta.domain.toLowerCase().includes(filterLower)) {
          continue;
        }

        const card = document.createElement('div');
        card.className = 'p-4 rounded-xl border border-slate-200/90 bg-slate-50/50 hover:bg-white hover:border-sdw-gold/60 transition shadow-sm flex flex-col justify-between space-y-3';
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between">
              <span class="font-bold text-xs text-slate-800 font-mono">${escapeHtml(name)}</span>
              <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold">${meta.prefix}000001</span>
            </div>
            <div class="text-[11px] text-slate-500 mt-0.5">${escapeHtml(meta.domain)}</div>
            <div class="mt-2 flex flex-wrap gap-1">
              ${meta.cols.slice(0, 5).map(c => `<span class="text-[9px] font-mono bg-white border border-slate-200 px-1 py-0.5 rounded text-slate-600">${c}</span>`).join('')}
              ${meta.cols.length > 5 ? `<span class="text-[9px] font-mono bg-slate-200 text-slate-600 px-1 py-0.5 rounded">+${meta.cols.length - 5}</span>` : ''}
            </div>
          </div>
          <div class="text-[10px] text-slate-400 border-t border-slate-200/60 pt-2 flex items-center justify-between">
            <span>Kolom: ${meta.cols.length}</span>
            <span class="text-emerald-700 font-semibold">&bull; State Locked</span>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    function filterSheets() {
      const q = document.getElementById('schemaSearch').value;
      renderSheetGrid(q);
    }
  </script>
</body>
</html>
